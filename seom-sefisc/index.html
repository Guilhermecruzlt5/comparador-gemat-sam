<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Central SEOM / SEFISC — URE Leste 5</title><style>
:root{--navy:#173f4d;--tiffany:#63c8c4;--tiffany2:#e0f6f4;--olive2:#edf2e4;--lilac2:#eee9f7;--text:#25363d;--muted:#6e7e83;--line:#d8e5e7}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#edf5f5,#f7fafb);color:var(--text)}.hero{padding:44px 24px 36px;background:linear-gradient(135deg,#173f4d,#23586b);color:#fff}.hero-inner{max-width:1220px;margin:auto}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(99,200,196,.18);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:800}.hero h1{font-size:38px;margin:14px 0 8px}.hero p{margin:0;opacity:.9;font-size:16px}main{max-width:1220px;margin:20px auto;padding:0 20px}.toolbar{display:grid;grid-template-columns:1fr 220px 260px;gap:10px;margin-bottom:16px}input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--tiffany);box-shadow:0 0 0 3px var(--tiffany2)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 5px 18px #173f4d0d}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi strong{display:block;color:var(--navy);font-size:25px;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 6px 20px #173f4d0f}.card-top{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--lilac2);color:#4d3a72;font-size:11px;font-weight:800}.badge.green{background:var(--olive2);color:#465234}.badge.tiffany{background:var(--tiffany2);color:#1e6460}.file-number{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.6px}.card h3{margin:7px 0 12px;font-size:18px;color:var(--navy)}.meta{font-size:13px;color:var(--muted);margin:6px 0}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:800}.tiffany{background:var(--tiffany);color:#123b40}.phone{background:#eaf2f4;color:var(--navy)}.empty{display:none;background:#fff;border:1px dashed var(--line);padding:24px;border-radius:14px;color:var(--muted);text-align:center}footer{text-align:center;color:var(--muted);font-size:12px;padding:28px}@media(max-width:900px){.toolbar{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{padding:32px 20px}.hero h1{font-size:29px}}
</style></head><body><section class="hero"><div class="hero-inner"><span class="pill">URE LESTE 5 • CENTRAL DE ACESSO</span><h1>SEOM / SEFISC</h1><p>Central única para contatos, arquivos, controles, relatórios e demandas.</p></div></section><main><div class="toolbar"><input id="search" placeholder="Pesquisar arquivo, serviço, categoria ou responsável..."><select id="service"><option value="">Todos os serviços</option><option>SEOM</option><option>SEFISC</option></select><select id="category"><option value="">Todas as categorias</option><option>Gestão / Informações</option><option>Frota / Controle</option><option>Zeladoria</option><option>BI / Manutenção Predial</option><option>Água / Consumo</option><option>Obras</option><option>Obras / Acompanhamento</option><option>GEMAT / SAM</option></select></div><div class="kpis"><div class="kpi"><small>Registros</small><strong id="kTotal">0</strong></div><div class="kpi"><small>Arquivos com link</small><strong id="kLinks">0</strong></div><div class="kpi"><small>SEOM</small><strong id="kSeom">0</strong></div><div class="kpi"><small>SEFISC</small><strong id="kSefisc">0</strong></div><div class="kpi"><small>Obras</small><strong id="kObras">0</strong></div></div><div id="grid" class="grid"></div><div id="empty" class="empty">Nenhum registro encontrado com os filtros informados.</div></main><footer>SEOM • SEFISC • URE Leste 5</footer><script>
const DATA=[

{id:6,name:"Pedido de Obras",service:"SEOM",category:"Obras",responsavel:"Chefe de Serviço e Seção",telefone:"2602 - 2749",url:"https://seesp-my.sharepoint.com/:x:/g/personal/guilherme_cruz_educacao_sp_gov_br/IQAgkHjSRmA1R5PZO5bsaJpPAdL-_hgulHYR30xo44FeJS8?rtime=wTCgKOF53kg"},

];
const grid=document.getElementById('grid'),search=document.getElementById('search'),service=document.getElementById('service'),category=document.getElementById('category'),empty=document.getElementById('empty');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function phone(v){return 'tel:'+String(v).replace(/\D/g,'')}
function render(){const q=search.value.toLowerCase().trim(),sv=service.value,ct=category.value;let shown=0,links=0,seom=0,sefisc=0,obras=0;grid.innerHTML='';DATA.forEach((d,i)=>{const text=[d.name,d.service,d.category,d.responsavel,d.telefone].join(' ').toLowerCase();if((q&&!text.includes(q))||(sv&&d.service!==sv)||(ct&&d.category!==ct))return;shown++;if(d.url)links++;if(d.service==='SEOM')seom++;if(d.service==='SEFISC')sefisc++;if(d.category.toLowerCase().includes('obras'))obras++;const a=document.createElement('article');a.className='card';a.innerHTML=`<div class="card-top"><span class="badge tiffany">${esc(d.service)}</span><span class="badge green">${esc(d.category)}</span></div><div class="file-number">ARQUIVO ${String(i+1).padStart(2,'0')}</div><h3>${esc(d.name)}</h3><div class="meta"><strong>Responsável:</strong> ${esc(d.responsavel)}</div><div class="meta"><strong>Telefone:</strong> ${esc(d.telefone)}</div><div class="actions"><a class="btn tiffany" target="_blank" rel="noopener" href="${esc(d.url)}">Abrir arquivo ↗</a><a class="btn phone" href="${phone(d.telefone)}">Ligar</a></div>`;grid.appendChild(a)});document.getElementById('kTotal').textContent=shown;document.getElementById('kLinks').textContent=links;document.getElementById('kSeom').textContent=seom;document.getElementById('kSefisc').textContent=sefisc;document.getElementById('kObras').textContent=obras;empty.style.display=shown?'none':'block'}search.addEventListener('input',render);service.addEventListener('change',render);category.addEventListener('change',render);render();
</script></body></html>
